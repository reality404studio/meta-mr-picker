<style>

html,body{height:100%;margin:0}

.hud{position:absolute;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}

.bottom{padding:0 max(16px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));

<script type="importmap">
{"imports":{
  "three":"./vendor/three/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls }     from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ─────────────────────────────────────────────────────────── measured pigment
// Values from scripts/catch-lab (catch-analyze-6b12) via assets/yunseul_paint.json:
// k=3 k-means over a 64x64 grid of the yunseul crop, lightDir = bright-cluster offset x2.
const PAINT = {
  lightTone : 0xCDBFAE,
  midTone   : 0xA2A6A9,
  shadowTone: 0x737A81,
  lightDir  : new THREE.Vector3(0.0735, 0.7538, -0.653).normalize()
};

const SURFACES = {
  orb: {
    label: 'ORB',
    note: 'A ring of caught water light, floating. <em>Reach in and the surface answers — and so do the real desk and the real wall, which pick up its caustic and ripple with it. Left pinch changes the look, right pinch moves it.</em>'
  },
  canvas: {
    label: 'CANVAS',
    note: 'The caught light stretched on canvas and hung on the wall. <em>Pinch with both hands at two opposite corners to size and hang it. Then left pinch swings it on Y, right pinch slides it in and out to sit flush.</em>'
  },
  bare: {
    label: 'BARE',
    note: 'The desk as it is. Reference shot — everything below is measured against this.'
  },
  mat: {
    label: 'MAT',
    note: 'A desk mat: one flat plane, 60 × 40 cm. <em>Note what the cel ramp does here — a flat surface has one single normal, so the two-tone band is one constant value across the whole mat. The ramp is off; what is left is a tinted photograph.</em>'
  },
  cloth: {
    label: 'CLOTH',
    note: 'The same pigment as a cloth laid over the desk, falling 20 cm past the edges. <em>The fold gives the surface a second and third normal, so the two-tone ramp separates top from skirt.</em>'
  },
  things: {
    label: 'THINGS',
    note: 'Nothing is laid on the desk — the things already on it are the surface. <em>This is what the triplanar sampler is for: curved, UV-less objects, and a normal that sweeps the whole ramp.</em>'
  },
  light: {
    label: 'LIGHT',
    note: 'The desk keeps its own surface; only the water light falls on it, projected in world space and added. <em>Nothing is painted — the pigment acts as a caustic.</em>'
  }
};

// ─────────────────────────────────────────────────────────── shader (CelPaint → GLSL)
// Port of Assets/Shaders/Cel/CelPaint.shader + reference/texture-lab PigmentCommon.hlsl.
// Triplanar read in object space (pigment sticks to the object) or world space (light mode).
const VERT = /* glsl */`
varying vec3 vLocalPos;
varying vec3 vLocalNrm;
varying vec3 vWorldPos;
varying vec3 vWorldNrm;
void main() {
  vLocalPos = position;
  vLocalNrm = normal;
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  vWorldNrm = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const FRAG = /* glsl */`
precision highp float;
uniform sampler2D uPigment;
uniform vec3  uLightTone, uShadowTone, uMidTone, uBareLight, uBareShadow;
uniform vec3  uLightDir, uFillOrigin;
uniform float uToneMix, uThreshold, uSoftness, uTriScale, uTriSharp;
uniform float uBands, uGlint, uFill, uFillRadius, uWorldSpace, uCaustic, uCausticContrast;
uniform float uFit, uWeave;
uniform vec2  uFitSize;
varying vec3 vLocalPos, vLocalNrm, vWorldPos, vWorldNrm;

float luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

// Texture wrap mode does the repeating (RepeatWrapping for the periodized tile,
// MirroredRepeat for the raw loop), so no fract() here — that would break derivatives.
vec3 triplanar(vec3 p, vec3 n){
  vec3 w = pow(abs(n), vec3(uTriSharp));
  w /= max(w.x + w.y + w.z, 1e-4);
  vec3 q = p * uTriScale;
  return texture2D(uPigment, q.zy + 0.13).rgb * w.x
       + texture2D(uPigment, q.xz + 0.37).rgb * w.y
       + texture2D(uPigment, q.xy + 0.71).rgb * w.z;
}

// A painting, not wallpaper: the caught scene is laid across the face exactly once, and
// the border pixels carry on around the sides of the stretcher — a gallery wrap. Clamping
// in the shader does the wrap, so the texture keeps whatever repeat mode the tiling modes need.
vec3 canvasFit(vec3 p){
  vec2 uv = clamp(p.xy / uFitSize + 0.5, 0.0, 1.0);
  vec3 c  = texture2D(uPigment, uv).rgb;
  float weave = sin(p.x * uWeave) * sin(p.y * uWeave) * 0.5 + 0.5;
  return c * (0.97 + 0.03 * weave);
}

float ramp(float ndl, float shift){
  return smoothstep(uThreshold - uSoftness + shift, uThreshold + uSoftness + shift, ndl);
}

void main(){
  vec3  l    = normalize(uLightDir);
  vec3  nW   = normalize(vWorldNrm);
  float ndl  = dot(nW, l);

  bool  world = uWorldSpace > 0.5;
  vec3  p     = world ? vWorldPos : vLocalPos;
  vec3  n     = world ? nW : normalize(vLocalNrm);
  vec3  base  = (uFit > 0.5) ? canvasFit(vLocalPos) : triplanar(p, n);
  float h     = luma(base);

  // Bucket fill: a flood from the contact point outward (docs/DECIDED.md 2026-11-04,
  // "dab 은 버킷 채우기" — the whole surface fills at once, it does not smear).
  float d    = length(vLocalPos - uFillOrigin) / max(uFillRadius, 1e-4);
  float mask = 1.0 - smoothstep(uFill - 0.07, uFill + 0.07, d);

  if (uCaustic > 0.5) {
    float c = pow(h, uCausticContrast) * 2.1;
    gl_FragColor = vec4(uLightTone * c * mask, 1.0);
  } else {
    vec3 tone;
    if (uBands > 2.5) {
      tone = mix(mix(uShadowTone, uMidTone, ramp(ndl, -0.22)), uLightTone, ramp(ndl, 0.22));
    } else {
      tone = mix(uShadowTone, uLightTone, ramp(ndl, 0.0));
    }
    vec3 painted = mix(base, tone, uToneMix);

    // Glint: only the top few percent of luminance glows (PigmentCommon GlintMask).
    float g = smoothstep(0.62, 0.70, h) * 1.6 + smoothstep(0.70, 1.0, h) * 2.5;
    painted += uGlint * g * uLightTone * 0.22;

    vec3 bare = mix(uBareShadow, uBareLight, ramp(ndl, 0.0));
    gl_FragColor = vec4(mix(bare, painted, mask), 1.0);
  }
}`;

// ─────────────────────────────────────────────────────────── renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
let roomFog = null;   // kept so passthrough can drop it and the desktop view can get it back
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.02, 40);
camera.position.set(0, 1.46, 0.62);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.45, -1.08);
controls.enableDamping = true;
controls.minDistance = 0.3;
controls.maxDistance = 4;
controls.maxPolarAngle = Math.PI * 0.495;

// ─────────────────────────────────────────────────────────── pigment textures
const texLoader = new THREE.TextureLoader();
const stillTex = texLoader.load('assets/yunseul_tile.png');   // periodized — seamless repeat
stillTex.wrapS = stillTex.wrapT = THREE.RepeatWrapping;
stillTex.colorSpace = THREE.SRGBColorSpace;
stillTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const video = document.getElementById('loopvid');
const loopTex = new THREE.VideoTexture(video);
// The loop is a raw crop, not periodized, so mirror the repeat to hide the tile seam
// (PigmentCommon.hlsl MirrorRepeat, same trick).
loopTex.wrapS = loopTex.wrapT = THREE.MirroredRepeatWrapping;
loopTex.colorSpace = THREE.SRGBColorSpace;

// ─────────────────────────────────────────────────────────── materials
function pigmentMaterial(opts = {}) {
  return new THREE.ShaderMaterial({
    vertexShader: VERT,
    fragmentShader: FRAG,
    transparent: !!opts.caustic,
    blending: opts.caustic ? THREE.AdditiveBlending : THREE.NormalBlending,
    depthWrite: !opts.caustic,
    uniforms: {
      uPigment        : { value: stillTex },
      uLightTone      : { value: new THREE.Color(PAINT.lightTone) },
      uMidTone        : { value: new THREE.Color(PAINT.midTone) },
      uShadowTone     : { value: new THREE.Color(PAINT.shadowTone) },
      uBareLight      : { value: new THREE.Color(0xF0EEE6) },
      uBareShadow     : { value: new THREE.Color(0x9AA0A8) },
      uLightDir       : { value: PAINT.lightDir.clone() },
      uToneMix        : { value: 0.65 },
      uThreshold      : { value: 0.0 },
      uSoftness       : { value: 0.06 },
      uTriScale       : { value: opts.triScale ?? 2.4 },
      uTriSharp       : { value: 6.0 },
      uBands          : { value: 3.0 },
      uGlint          : { value: 1.0 },
      uFill           : { value: 1.0 },
      uFillOrigin     : { value: new THREE.Vector3() },
      uFillRadius     : { value: opts.fillRadius ?? 0.5 },
      uWorldSpace     : { value: opts.caustic ? 1.0 : 0.0 },
      uCaustic        : { value: opts.caustic ? 1.0 : 0.0 },
      uCausticContrast: { value: 3.2 },
      uFit            : { value: opts.fit ? 1.0 : 0.0 },
      uFitSize        : { value: new THREE.Vector2(0.6, 0.45) },
      uWeave          : { value: 1600.0 }
    }
  });
}

const mats = [];
function reg(m) { m.userData.baseTriScale = m.uniforms.uTriScale.value; mats.push(m); return m; }

// ─────────────────────────────────────────────────────────── desk anchor
// deskRoot origin = the desk's top surface, centre. In AR it is dropped on a hit-test
// point; on desktop it sits on a simulated desk.
const deskRoot = new THREE.Group();
scene.add(deskRoot);

const DESK = { w: 1.2, d: 0.6, h: 0.74 };

// -- surface: MAT (the flat baseline)
const matMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(0.6, 0.4),
  reg(pigmentMaterial({ triScale: 2.4, fillRadius: 0.38 }))
);
matMesh.rotation.x = -Math.PI / 2;
matMesh.position.y = 0.0015;

// -- surface: CLOTH (same pigment, but folded over the desk edge)
const clothMesh = new THREE.Mesh(
  new RoundedBoxGeometry(DESK.w + 0.08, 0.20, DESK.d + 0.08, 4, 0.028),
  reg(pigmentMaterial({ triScale: 2.0, fillRadius: 0.72 }))
);
clothMesh.position.y = -0.0985;

// -- surface: THINGS (the objects already on the desk)
const things = new THREE.Group();
const keyboard = new THREE.Mesh(
  new RoundedBoxGeometry(0.36, 0.022, 0.13, 3, 0.006),
  reg(pigmentMaterial({ triScale: 5.5, fillRadius: 0.21 }))
);
keyboard.position.set(0.0, 0.011, 0.07);

const mug = new THREE.Mesh(
  new THREE.CylinderGeometry(0.041, 0.036, 0.095, 40, 1),
  reg(pigmentMaterial({ triScale: 7.0, fillRadius: 0.085 }))
);
mug.position.set(-0.28, 0.0475, -0.04);

const bottleProfile = [];
for (let i = 0; i <= 26; i++) {
  const t = i / 26, y = t * 0.235;
  let r;
  if (t < 0.70)      r = 0.034;
  else if (t < 0.82) r = 0.034 - (t - 0.70) / 0.12 * 0.019;
  else               r = 0.015;
  bottleProfile.push(new THREE.Vector2(Math.max(r, 0.001), y));
}
const bottle = new THREE.Mesh(
  new THREE.LatheGeometry(bottleProfile, 44),
  reg(pigmentMaterial({ triScale: 6.0, fillRadius: 0.2 }))
);
bottle.position.set(0.26, 0, -0.05);

things.add(keyboard, mug, bottle);

// -- surface: LIGHT (world-space caustic added onto whatever the desk already is)
const lightMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(DESK.w, DESK.d),
  reg(pigmentMaterial({ caustic: true, triScale: 1.6, fillRadius: 0.68 }))
);
lightMesh.rotation.x = -Math.PI / 2;
lightMesh.position.y = 0.003;

deskRoot.add(matMesh, clothMesh, things, lightMesh);

// ─────────────────────────────────────────────────────────── the wall piece
const ART = { w: 0.90, h: 0.60, depth: 0.042 };
const artRoot = new THREE.Group();
artRoot.position.set(0, 1.45, -1.08);
scene.add(artRoot);

const canvasMesh = new THREE.Mesh(
  new RoundedBoxGeometry(ART.w, ART.h, ART.depth, 2, 0.0035),
  reg(pigmentMaterial({ fit: true, fillRadius: 0.56 }))
);
// A stretched canvas reads as paint on cloth, not a photo under glass, so the two-tone
// ramp is pulled back — the caught scene has to stay legible as the artwork.
canvasMesh.material.uniforms.uToneMix.value = 0.42;
canvasMesh.material.uniforms.uFitSize.value.set(ART.w, ART.h);
artRoot.add(canvasMesh);

function setCanvasSize(w, h) {
  ART.w = THREE.MathUtils.clamp(w, 0.18, 2.40);
  ART.h = THREE.MathUtils.clamp(h, 0.14, 1.80);
  canvasMesh.geometry.dispose();
  canvasMesh.geometry = new RoundedBoxGeometry(ART.w, ART.h, ART.depth, 2, 0.0035);
  canvasMesh.material.uniforms.uFitSize.value.set(ART.w, ART.h);
  canvasMesh.material.uniforms.uFillRadius.value = Math.hypot(ART.w, ART.h) * 0.5 + 0.04;
}


// ─────────────────────────────────────────────────────────── the orb and its light
// Ported from PR #1 reference/texture-lab/web/shader-lab: seven looks over the same
// caught pigment. The lab called them exploration; which one ships is still a human call
// (docs/DECIDED.md 2026-11-03 — the object look is two-tone cel until someone says otherwise).
const BUILD = '__BUILD__';   // replaced at deploy; stays __BUILD__ when served from a checkout

const ORB_MODES = ['RAW', '', 'CHROME', 'CAUSTIC', 'HOLOGRAM', 'CONTOUR', 'HALFTONE'];
// Glint is out (2026-11-04, 사람 결정). Its shader index is simply never cycled to, so the
// rest keep their numbers.
const ORB_CYCLE = [2, 3, 4, 5, 6, 0];

const ORB_COMMON = /* glsl */`
uniform sampler2D uTex;
uniform float uScale;
vec2 mir(vec2 t){ t = mod(t, 2.0); return 1.0 - abs(1.0 - t); }
float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
vec3 triS(vec3 p, vec3 n){
  vec3 w = pow(abs(n), vec3(4.0)); w /= (w.x + w.y + w.z);
  float s = uScale * 0.8;
  return texture2D(uTex, mir(p.zy * s + 0.13)).rgb * w.x
       + texture2D(uTex, mir(p.xz * s + 0.37)).rgb * w.y
       + texture2D(uTex, mir(p.xy * s + 0.71)).rgb * w.z;
}
vec3 vid(vec3 p, vec3 n){ return lin(triS(p, n)); }
// 8-tap ring blur: a softer height field, so normals and contours read as a surface
// instead of chasing single texels (shader-lab's vidBlur).
vec3 vidBlur(vec3 p, vec3 n, float r){
  vec3 acc = vid(p, n);
  for (int i = 0; i < 8; i++){
    float a = float(i) * 0.785398;
    vec2 o = vec2(cos(a), sin(a)) * r;
    acc += vid(p + vec3(o.x, o.y, o.x - o.y) / max(uScale, 0.01), n);
  }
  return acc / 9.0;
}
`;

// A touch does not just dent the surface it lands on — it sets a wave running, and the
// same wave is handed to the desk and the wall so the room answers the finger.
const ORB_VERT = /* glsl */`
${ORB_COMMON}
uniform float uDisp, uTime, uTouch, uWave;
uniform vec3  uTouchPt;
varying vec3 vWPos, vWNrm, vOPos, vONrm;
void main(){
  vONrm = normal; vOPos = position;
  float h  = lum(vid(position, normal));
  float td = distance(position, uTouchPt);
  float rip = sin(td * 26.0 - uTime * uWave) * exp(-td * 5.5) * uTouch * 0.055;
  vec3  pp = position + normal * ((h - 0.35) * uDisp + rip);
  vec4  wp = modelMatrix * vec4(pp, 1.0);
  vWPos = wp.xyz;
  vWNrm = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const ORB_FRAG = /* glsl */`
${ORB_COMMON}
uniform int   uMode;
uniform float uTime, uInt, uParam;
uniform vec3  uTint, uBase;
varying vec3 vWPos, vWNrm, vOPos, vONrm;

vec3 bumpN(vec3 pos, vec3 n, float h, float k){
  vec3 dpx = dFdx(pos), dpy = dFdy(pos);
  float dhx = dFdx(h) * k, dhy = dFdy(h) * k;
  vec3 r1 = cross(dpy, n), r2 = cross(n, dpx);
  float det = dot(dpx, r1);
  vec3 g = sign(det) * (dhx * r1 + dhy * r2);
  return normalize(abs(det) * n - g);
}
vec3 env(vec3 r){
  float y = r.y;
  vec3 sky = mix(vec3(0.10,0.12,0.15), vec3(0.62,0.70,0.78), smoothstep(-0.05, 0.7, y));
  vec3 gnd = mix(vec3(0.015), vec3(0.09,0.10,0.10), smoothstep(-1.0, 0.0, y));
  vec3 c = mix(gnd, sky, smoothstep(-0.05, 0.05, y));
  c += vec3(0.9) * exp(-abs(y - 0.02) * 18.0) * 0.4;
  float a = atan(r.z, r.x);
  c += vec3(1.0) * smoothstep(0.70, 0.95, sin(a * 3.0)) * smoothstep(0.15, 0.35, y) * smoothstep(0.85, 0.6, y) * 0.8;
  c += vec3(1.0,0.96,0.88) * pow(max(dot(r, normalize(vec3(0.35,0.75,0.55))), 0.0), 36.0) * 2.4;
  return c;
}
vec3 pal(float t){ return 0.5 + 0.5 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + t)); }

void main(){
  vec3 N = normalize(vWNrm);
  if (!gl_FrontFacing) N = -N;
  vec3 V = normalize(cameraPosition - vWPos);
  vec3 L = normalize(vec3(0.5, 0.85, 0.45));

  vec3  tex  = (uMode == 3) ? lin(triS(vWPos, N)) : vid(vOPos, normalize(vONrm));
  float h    = lum(tex);
  float hs   = (uMode == 2 || uMode == 5) ? lum(vidBlur(vOPos, normalize(vONrm), 0.055)) : h;
  float fres = pow(1.0 - clamp(abs(dot(N, V)), 0.0, 1.0), 3.0);
  float hc   = sqrt(hs) * mix(4.0, 22.0, uParam);
  float aa   = fwidth(hc);
  vec3  Nb   = bumpN(vWPos, N, hs, mix(0.3, 6.0, uParam));

  vec3 col;
  if (uMode == 0){
    float d = max(dot(N, L), 0.0);
    col = tex * (0.3 + 0.8 * d) * uInt;
    col += pow(max(dot(reflect(-L, N), V), 0.0), 40.0) * 0.25;
  } else if (uMode == 2){
    vec3 R = reflect(-V, Nb);
    float F = 0.55 + 0.45 * pow(1.0 - max(dot(Nb, V), 0.0), 5.0);
    col = env(R) * F * mix(vec3(1.0), uTint, 0.6) * uInt;
    col += uTint * pow(hs, 4.0) * 0.9 * uInt;
  } else if (uMode == 3){
    float d = max(dot(N, L), 0.0);
    col = uBase * (0.12 + 0.75 * d);
    col += uTint * pow(h, mix(1.5, 5.0, uParam)) * 4.0 * (0.35 + 0.65 * d) * uInt;
  } else if (uMode == 4){
    float scan = 0.7 + 0.3 * sin(vWPos.y * 160.0 - uTime * 5.0);
    col = pal(sqrt(h) * mix(0.6, 2.0, uParam) + fres * 0.7 + uTime * 0.06)
        * (pow(h, 1.5) * 2.2 + fres * 0.8) * scan * uInt;
    col *= mix(vec3(1.0), uTint, 0.35);
  } else if (uMode == 5){
    float f = abs(fract(hc) - 0.5);
    float d = max(dot(N, L), 0.0);
    col = uBase * (0.08 + 0.35 * d);
    col += uTint * (1.0 - smoothstep(0.0, aa * 1.5, 0.5 - f)) * (0.6 + 0.6 * h) * uInt;
  } else {
    vec2 g = gl_FragCoord.xy / mix(5.0, 16.0, uParam);
    vec2 f = fract(g) - 0.5;
    float d = max(dot(N, L), 0.0);
    float r = sqrt(clamp(sqrt(h) * (0.4 + 0.8 * d), 0.0, 1.0)) * 0.62;
    col = uBase * 0.06 + uTint * (1.0 - smoothstep(r - 0.06, r + 0.02, length(f))) * uInt;
  }
  gl_FragColor = vec4(max(col, 0.0), 1.0);
  #include <colorspace_fragment>
}`;

// The catcher planes are the trick that stops the orb floating free of the room: an
// invisible plane on the real desk and the real wall, carrying only the pigment's
// brightness, added to the passthrough and faded out by distance from the orb. No ray
// tracing — a distance falloff and the same wave the finger started.
const CATCH_FRAG = /* glsl */`
${ORB_COMMON}
uniform vec3  uOrbPos, uTint;
uniform float uTime, uNear, uFar, uGain, uTouch, uWave, uContrast;
varying vec3 vWPos, vWNrm;
void main(){
  float d    = distance(vWPos, uOrbPos);
  float fall = 1.0 - smoothstep(uNear, uFar, d);
  if (fall <= 0.001) discard;
  vec3  n    = normalize(vWNrm);
  // drift sideways across the surface, never along the axis it is projected on
  vec3  t    = abs(n.y) > 0.5 ? vec3(1.0, 0.0, 0.0) : normalize(cross(vec3(0.0, 1.0, 0.0), n));
  vec3  tex  = lin(triS(vWPos + t * uTime * 0.010, n));
  float c    = pow(lum(tex), uContrast) * 4.0;
  float rip  = 1.0 + sin(d * 16.0 - uTime * uWave) * 0.45 * uTouch * exp(-d * 1.6);
  gl_FragColor = vec4(uTint * c * fall * rip * uGain * (1.0 + uTouch * 0.5), 1.0);
  #include <colorspace_fragment>
}`;

const CATCH_VERT = /* glsl */`
varying vec3 vWPos, vWNrm;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWPos = wp.xyz;
  vWNrm = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

// The catchers borrow the poses the desk and wall calibration already produced.
function layoutCatchers() {

// How close the nearest fingertip is to the ring, 0 far .. 1 touching. The same number
// drives the orb's wave and both catchers, so the room jumps when the finger does.
const TORUS_R = 0.155, TORUS_r = 0.062;
function updateTouch(frame, refSpace) {
  const session = renderer.xr.getSession();
  if (!session || !frame.getJointPose) return;
  let best = Infinity, bestLocal = null;
  for (const src of session.inputSources) {
    if (!src.hand) continue;
    const j = src.hand.get('index-finger-tip');
    if (!j) continue;
    const jp = frame.getJointPose(j, refSpace);
    if (!jp) continue;
    const w = new THREE.Vector3(jp.transform.position.x, jp.transform.position.y, jp.transform.position.z);
    const l = orbRoot.worldToLocal(w.clone());
    const q = Math.hypot(Math.hypot(l.x, l.y) - TORUS_R, l.z);
    const d = Math.max(0, q - TORUS_r);
    if (d < best) { best = d; bestLocal = l; }
  }
  const target = best === Infinity ? 0 : 1 - THREE.MathUtils.clamp(best / 0.16, 0, 1);
  orbShared.uTouch.value += (target - orbShared.uTouch.value) * 0.3;
  if (bestLocal) orbMat.uniforms.uTouchPt.value.copy(bestLocal);
}

// ─────────────────────────────────────────────────────────── in-XR control plates
// Billboarded band plates, same idea as Runtime/PunchCueView.cs, so the surface can be

const plates = new THREE.Group();

function plateTexture(text, pressed) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 96;
  const g = c.getContext('2d');
  g.fillStyle = pressed ? '#F0EEE6' : 'rgba(11,14,18,0.82)';
  g.fillRect(0, 0, 256, 96);
  g.strokeStyle = pressed ? '#15317C' : '#F0EEE6';
  g.lineWidth = 4;
  g.strokeRect(2, 2, 252, 92);
  g.fillStyle = pressed ? '#15317C' : '#F0EEE6';
  g.font = '500 40px "IBM Plex Mono", monospace';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(text, 128, 50);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const PLATE_KEYS = ['orb', 'canvas', 'mat', 'cloth', 'things', 'light', 'pour', 'sound'];
const plateMeshes = PLATE_KEYS.map((key, i) => {

  );

  plateMeshes.forEach((m, i) => {
    m.position.set((i - (PLATE_KEYS.length - 1) / 2) * 0.098, 0, 0);

  } else if (surface === 'canvas') {

function refreshPlates() {
  for (const m of plateMeshes) {
    const key = m.userData.key;
    const pressed = key === 'sound' ? soundOn : key === surface;
    const label = key === 'sound' ? (soundOn ? 'SOUND' : 'MUTED') : key.toUpperCase();
    m.material.map.dispose();
    m.material.map = plateTexture(label, pressed);
    m.material.needsUpdate = true;
  }
}

// ─────────────────────────────────────────────────────────── placing it on a real desk
// Order of preference:
//   1. plane-detection — if the desk is already in Quest's Space Setup, take its real
//      height and extent and skip calibration entirely.
//   2. two-hand pinch rectangle — docs/DECIDED.md 2026-11-04 [공통]: desk height is set by
//      making a rectangle with both hands, NOT by tapping points.
//   3. hit-test reticle — last resort when neither is available.
const PINCH_ON  = 0.025;
const PINCH_OFF = 0.040;   // hysteresis, or the pinch flickers at the threshold
let planeScanned = false;
let wallScanned  = false;
let needArtHang  = false;
let calibrating  = false;
let calibA = null, calibB = null;
let placedBy = '';

const calibBox = new THREE.LineSegments(
  new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({ color: 0xF0EEE6 })
);
calibBox.visible = false;
scene.add(calibBox);

function headRight(yaw) { return new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)); }

function drawCalibBox(p1, p2) {
  let c;
  if (surface === 'canvas') {
    // stood up on Y: the two pinches are opposite corners of an upright rectangle
    const yaw = headYaw(), right = headRight(yaw), up = new THREE.Vector3(0, 1, 0);
    const mid = p1.clone().add(p2).multiplyScalar(0.5);
    const hw = Math.abs(p2.clone().sub(p1).dot(right)) / 2;
    const hh = Math.abs(p2.y - p1.y) / 2;
    c = [
      mid.clone().addScaledVector(right, -hw).addScaledVector(up,  hh),
      mid.clone().addScaledVector(right,  hw).addScaledVector(up,  hh),
      mid.clone().addScaledVector(right,  hw).addScaledVector(up, -hh),
      mid.clone().addScaledVector(right, -hw).addScaledVector(up, -hh)
    ];
  } else {
    const y = (p1.y + p2.y) / 2;
    c = [
      new THREE.Vector3(p1.x, y, p1.z), new THREE.Vector3(p2.x, y, p1.z),
      new THREE.Vector3(p2.x, y, p2.z), new THREE.Vector3(p1.x, y, p2.z)
    ];
  }
  const pts = [];
  for (let i = 0; i < 4; i++) { pts.push(c[i], c[(i + 1) % 4]); }
  calibBox.geometry.dispose();
  calibBox.geometry = new THREE.BufferGeometry().setFromPoints(pts);
  calibBox.visible = true;
}

function pinchPoint(frame, refSpace, src) {
  if (!src.hand || !frame.getJointPose) return null;
  const tip = src.hand.get('index-finger-tip'), thumb = src.hand.get('thumb-tip');
  if (!tip || !thumb) return null;
  const a = frame.getJointPose(tip, refSpace), b = frame.getJointPose(thumb, refSpace);
  if (!a || !b) return null;
  const pa = a.transform.position, pb = b.transform.position;
  const gap = Math.hypot(pa.x - pb.x, pa.y - pb.y, pa.z - pb.z);
  const limit = calibrating ? PINCH_OFF : PINCH_ON;
  if (gap > limit) return null;
  return new THREE.Vector3((pa.x + pb.x) / 2, (pa.y + pb.y) / 2, (pa.z + pb.z) / 2);
}

function headYaw() {
  const q = new THREE.Quaternion();
  (inXR ? renderer.xr.getCamera() : camera).getWorldQuaternion(q);
  return new THREE.Euler().setFromQuaternion(q, 'YXZ').y;
}

// The two pinch points are opposite corners of the desk. Height comes from their average
// Y; the rectangle is squared up to the way the person is sitting, so a tilted pair of
// hands does not tilt the cloth (the tilt is what sank the old catch square, REJECTED.md).
function commitRect(p1, p2) {
  const yaw = headYaw();
  const inv = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -yaw, 0));
  const a = p1.clone().applyQuaternion(inv), b = p2.clone().applyQuaternion(inv);
  const w = Math.abs(a.x - b.x), d = Math.abs(a.z - b.z);
  if (w < 0.12 && d < 0.12) return false;     // a stray double pinch, not a desk
  const mid = new THREE.Vector3((a.x + b.x) / 2, 0, (a.z + b.z) / 2)
    .applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0)));
  deskRoot.position.set(mid.x, (p1.y + p2.y) / 2, mid.z);
  deskRoot.quaternion.setFromEuler(new THREE.Euler(0, yaw, 0));
  setDeskSize(w, d);
  deskRoot.visible = true;
  placed = true; planeScanned = true; placedBy = 'hands';
  reticle.visible = false;
  pour();
  return true;
}

// Two pinches = opposite corners of the hanging piece. Width is read across the way the
// person is facing and height straight off Y, so a tilted pair of hands still hangs level.
function commitArt(p1, p2) {
  const yaw = headYaw();
  const d = p2.clone().sub(p1);
  const w = Math.abs(d.dot(headRight(yaw)));
  const h = Math.abs(d.y);
  if (w < 0.10 || h < 0.08) return false;
  artRoot.position.copy(p1.clone().add(p2).multiplyScalar(0.5));
  artRoot.rotation.set(0, yaw, 0);       // face turned back toward the viewer, upright
  setCanvasSize(w, h);
  artRoot.visible = true;
  placedArt = true; placedBy = 'hands';
  pour();
  return true;
}

// Left pinch swings it on Y, right pinch slides it along its own normal so it can be set
// flush to the wall. Both are measured from where the pinch started (DECIDED L2 pattern),
// and both keep their value on release — this is hanging a picture, not aiming.
const YAW_PER_M = Math.PI;

function applyYaw(g, p) {
  const dx = p.clone().sub(g.start).dot(headRight(g.yawHead));
  artRoot.rotation.set(0, g.yaw0 - dx * YAW_PER_M, 0);
}

function applyDepth(g, p) {
  const n = new THREE.Vector3(0, 0, 1).applyQuaternion(g.quat0);
  artRoot.position.copy(g.pos0).addScaledVector(n, p.clone().sub(g.start).dot(n));
}

function aimRay(frame, refSpace, src) {
  if (!src || !src.targetRaySpace) return false;
  const pose = frame.getPose(src.targetRaySpace, refSpace);
  if (!pose) return false;
  const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
  raycaster.ray.origin.setFromMatrixPosition(m);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(new THREE.Matrix4().extractRotation(m));
  return true;
}

function aimPlate(frame, refSpace, src) {
  if (!plates.visible || !aimRay(frame, refSpace, src)) return null;
  const hit = raycaster.intersectObjects(plateMeshes, false)[0];
  return hit ? hit.object.userData.key : null;
}

function tap(frame, refSpace, g, src) {
  if (g.plate) {
    if (g.plate === 'pour') pour();
    else if (g.plate === 'sound') toggleSound();
    else setSurface(g.plate);
    return;
  }
  if (surface !== 'canvas' && !placed) {       // desk, still unplaced: the reticle route
    if (reticle.visible) {
      deskRoot.position.setFromMatrixPosition(reticle.matrix);
      deskRoot.quaternion.setFromRotationMatrix(reticle.matrix);
      deskRoot.visible = true; placed = true; placedBy = 'tap';
      reticle.visible = false; pour();
    }
    return;
  }
  if (aimRay(frame, refSpace, src)) {
    const hit = raycaster.intersectObjects(activeMeshes(), true)[0];
    if (hit) { pour(hit.object.worldToLocal(hit.point.clone()), hit.object); return; }
  }
  pour();
}

const grip = { left: null, right: null };
const live = { left: null, right: null };

function trackHands(frame, refSpace) {
  const session = renderer.xr.getSession();
  if (!session) return;

  live.left = live.right = null;
  for (const src of session.inputSources) {
    const side = src.handedness;
    if (side !== 'left' && side !== 'right') continue;
    const pt = pinchPoint(frame, refSpace, src);
    if (pt) live[side] = { pt, src };
  }
  const L = live.left, R = live.right;

  // Both hands at once always means "lay the piece out", never an adjustment.
  if (L && R) {
    calibrating = true;
    calibA = L.pt; calibB = R.pt;
    drawCalibBox(calibA, calibB);
    grip.left = grip.right = null;
    return;
  }
  if (calibrating) {
    calibrating = false;
    calibBox.visible = false;
    if (calibA && calibB) {
      if (surface === 'canvas') commitArt(calibA, calibB);
      else                      commitRect(calibA, calibB);
    }
    calibA = calibB = null;
    return;                      // the release that ends a layout never starts a grip
  }

  for (const side of ['left', 'right']) {
    const cur = live[side], g = grip[side];

    if (cur && !g) {
      grip[side] = {
        src    : cur.src,
        start  : cur.pt.clone(),
        t0     : performance.now(),
        moved  : 0,
        yaw0   : artRoot.rotation.y,
        pos0   : artRoot.position.clone(),
        orbPos0: orbRoot.position.clone(),
        quat0  : artRoot.quaternion.clone(),
        yawHead: headYaw(),
        plate  : aimPlate(frame, refSpace, cur.src)
      };
      if (surface === 'orb' && !grip[side].plate && side === 'left') {
        cycleOrbMode();
        grip[side].consumed = true;
      }
    } else if (cur && g) {
      g.moved = Math.max(g.moved, cur.pt.distanceTo(g.start));
      if (surface === 'orb' && side === 'right' && !g.plate && g.moved > 0.02) {
        orbRoot.position.copy(g.orbPos0).add(cur.pt.clone().sub(g.start));
        g.consumed = true;
      } else if (surface === 'canvas' && placedArt && !g.plate && g.moved > 0.02) {
        if (side === 'left') applyYaw(g, cur.pt);
        else                 applyDepth(g, cur.pt);
      }
    } else if (!cur && g) {
      if (!g.consumed && g.moved < 0.04 && performance.now() - g.t0 < 600) tap(frame, refSpace, g, g.src);
      grip[side] = null;
    }
  }
}

// Vertical planes are walls. Hang the piece flat on the one the viewer is facing, at eye
// height, standing just off the surface the way a stretched canvas does.
function scanWalls(frame, refSpace) {
  if (wallScanned || !frame.detectedPlanes) return;
  const cam = renderer.xr.getCamera();
  const eye = new THREE.Vector3(); cam.getWorldPosition(eye);
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()));
  let best = null;
  for (const plane of frame.detectedPlanes) {
    if (plane.orientation !== 'vertical') continue;
    const pose = frame.getPose(plane.planeSpace, refSpace);
    if (!pose) continue;
    const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
    new THREE.Matrix4().fromArray(pose.transform.matrix).decompose(pos, quat, scl);
    // plane space has +Y along the surface normal
    const n = new THREE.Vector3(0, 1, 0).applyQuaternion(quat);
    const toWall = pos.clone().sub(eye);
    if (toWall.dot(fwd) < 0.2) continue;                 // behind or beside the viewer
    const facing = -n.dot(fwd);
    if (facing < 0.3) continue;                          // not turned toward us
    const score = facing * 2 - toWall.length() * 0.3;
    if (!best || score > best.score) best = { score, pos, n };
  }
  if (!best) return;
  const n = best.n.clone().setY(0).normalize();
  artRoot.position.set(
    best.pos.x + n.x * (ART.depth / 2 + 0.012),
    eye.y,
    best.pos.z + n.z * (ART.depth / 2 + 0.012)
  );
  artRoot.rotation.set(0, Math.atan2(n.x, n.z), 0);
  artRoot.visible = true;
  placedArt = true; placedBy = 'wall'; wallScanned = true; needArtHang = false;
  pour();
}

// Quest reports planes as horizontal or vertical rectangles. Take the biggest horizontal
// one sitting at desk height, and prefer one the room setup actually labelled a desk.
function scanPlanes(frame, refSpace) {
  if (planeScanned || !frame.detectedPlanes) return;
  let best = null;
  for (const plane of frame.detectedPlanes) {
    if (plane.orientation !== 'horizontal') continue;
    const pose = frame.getPose(plane.planeSpace, refSpace);
    if (!pose) continue;
    const y = pose.transform.position.y;
    if (y < 0.45 || y > 1.25) continue;
    let minx = Infinity, maxx = -Infinity, minz = Infinity, maxz = -Infinity;
    for (const pt of plane.polygon) {
      minx = Math.min(minx, pt.x); maxx = Math.max(maxx, pt.x);
      minz = Math.min(minz, pt.z); maxz = Math.max(maxz, pt.z);
    }
    const w = maxx - minx, d = maxz - minz;
    if (!(w > 0.3 && d > 0.2)) continue;
    const labelled = /desk|table/i.test(plane.semanticLabel || '');
    const score = w * d + (labelled ? 10 : 0);
    if (!best || score > best.score) best = { score, pose, w, d, cx: (minx + maxx) / 2, cz: (minz + maxz) / 2 };
  }
  if (!best) return;
  const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
  new THREE.Matrix4().fromArray(best.pose.transform.matrix).decompose(pos, quat, scl);
  const yaw = new THREE.Euler().setFromQuaternion(quat, 'YXZ').y;
  const off = new THREE.Vector3(best.cx, 0, best.cz).applyQuaternion(quat);
  deskRoot.position.copy(pos).add(off);
  deskRoot.quaternion.setFromEuler(new THREE.Euler(0, yaw, 0));
  setDeskSize(best.w, best.d);
  deskRoot.visible = true;
  placed = true; planeScanned = true; placedBy = 'room setup';
  reticle.visible = false;
  pour();
}


// ─────────────────────────────────────────────────────────── water, synthesised
// No sample files: nothing to download here, and a sample would not follow the finger.
// Two voices instead — a filtered noise wash for the lapping, and little falling-pitch
// droplets on top — both driven by the same uTouch the shaders use. Tail is long and soft
// rather than roomy: docs/DECIDED.md 2026-11-03, 소리는 동화 쪽 (포근함, 빈티지 잔향).
let actx = null, soundOn = true;
let wash = null, washGain = null, washFilter = null, washLfo = null, wet = null, dry = null;
let lastDrop = 0, prevTouch = 0, dropCount = 0;

function buildReverb(ctx, seconds, decay) {
  const n = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
    }
  }
  const cv = ctx.createConvolver();
  cv.buffer = buf;
  return cv;
}

function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();

  const verb = buildReverb(actx, 1.9, 2.6);
  wet = actx.createGain(); wet.gain.value = 0.34;
  dry = actx.createGain(); dry.gain.value = 0.8;
  verb.connect(wet); wet.connect(actx.destination); dry.connect(actx.destination);

  // looped noise, band-passed and wobbling — the lapping itself
  const len = actx.sampleRate * 2;
  const nb = actx.createBuffer(1, len, actx.sampleRate);
  const nd = nb.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {           // leaky integrator = softer than white
    last = (last + (Math.random() * 2 - 1) * 0.35) * 0.96;
    nd[i] = last;
  }
  wash = actx.createBufferSource();
  wash.buffer = nb; wash.loop = true;

  washFilter = actx.createBiquadFilter();
  washFilter.type = 'bandpass';
  washFilter.frequency.value = 820;
  washFilter.Q.value = 1.1;

  washGain = actx.createGain();
  washGain.gain.value = 0;

  const lfoGain = actx.createGain(); lfoGain.gain.value = 420;
  washLfo = actx.createOscillator();
  washLfo.type = 'sine'; washLfo.frequency.value = 1.1;
  washLfo.connect(lfoGain); lfoGain.connect(washFilter.frequency);

  wash.connect(washFilter); washFilter.connect(washGain);
  washGain.connect(dry); washGain.connect(verb);
  wash.start(); washLfo.start();
}

// one droplet: a sine dropping in pitch under a short envelope
function droplet(level) {
  if (!actx || !soundOn) return;
  dropCount++;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  const f0 = 760 + Math.random() * 900;
  o.type = 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f0 * 0.38, t + 0.09);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16 * level, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);
  o.connect(g); g.connect(dry); g.connect(wet);
  o.start(t); o.stop(t + 0.22);
}

function audioFrame(touch, dt) {
  if (!actx) return;
  const t = actx.currentTime;
  const target = soundOn ? Math.pow(Math.max(touch, 0), 1.6) * 0.17 : 0;
  washGain.gain.setTargetAtTime(target, t, 0.08);
  washLfo.frequency.setTargetAtTime(0.8 + touch * 2.6, t, 0.2);

  if (!soundOn || touch < 0.06) { prevTouch = touch; return; }
  // a drop on the way in, then a trickle whose rate follows how hard it is being touched
  const onset = touch - prevTouch > 0.10;
  const due = t - lastDrop > (0.55 - touch * 0.28) * (0.7 + Math.random() * 0.8);
  if (onset || due) { droplet(0.45 + touch * 0.55); lastDrop = t; }
  prevTouch = touch;
}

function toggleSound() {
  soundOn = !soundOn;
  if (soundOn) initAudio();
  refreshPlates();
  const b = document.getElementById('btn-sound');
  if (b) { b.setAttribute('aria-pressed', String(soundOn)); b.textContent = soundOn ? 'Sound' : 'Muted'; }
}

// ─────────────────────────────────────────────────────────── state
let surface = 'orb';
let pigment = 'still';
let fillT   = 1;      // animation clock for the bucket flood
let placed    = false;  // AR: has the desk been dropped yet
let placedArt = true;   // the wall piece always has a pose; XR re-hangs it on entry
let inXR    = false;

const activeMeshes = () => ({
  orb   : [orb],
  canvas: [canvasMesh],
  bare  : [],
  mat   : [matMesh],
  cloth : [clothMesh],
  things: [things],
  light : [lightMesh]
}[surface] || []);

function setSurface(key) {
  surface = key;
  artRoot.visible   = key === 'canvas';
  orbRoot.visible   = key === 'orb';
  catchers.visible  = key === 'orb';
  deskRoot.visible  = key !== 'canvas' && key !== 'orb' && (placed || !inXR);
  matMesh.visible   = key === 'mat';
  clothMesh.visible = key === 'cloth';
  things.visible    = key === 'things';
  lightMesh.visible = key === 'light';
  // In AR the real desk is the desk; on desktop the simulated one must show through
  // for 'light' and 'bare' to read at all.
  if (!inXR && roomHemi) {
    // the fake reflections only read against a dim room — same reason the shooting note
    // says to turn the lights down before filming passthrough
    const dim = key === 'orb' ? 0.13 : 1.0;
    roomHemi.intensity = 1.15 * dim;
    roomDir.intensity  = 1.25 * dim;
  }
  if (!inXR) {
    const t = key === 'orb'    ? orbRoot.position
            : key === 'canvas' ? artRoot.position
            : new THREE.Vector3(0, DESK.h, 0);
    controls.target.copy(t);
    controls.update();
  }
  document.getElementById('note').innerHTML = SURFACES[key].note;
  for (const b of document.querySelectorAll('[data-surface]'))
    b.setAttribute('aria-pressed', String(b.dataset.surface === key));
  refreshPlates();
  pour();
}

function setPigment(key) {
  pigment = key;
  const tex = key === 'loop' ? loopTex : stillTex;
  // The still is the periodized tile (catch-analyze-6b12, seam 11.2 -> 0.48), so it can be
  // repeated tightly. The loop is still a raw crop — PeriodicTile has not been run over the
  // frames yet — so it is mirrored and spread much wider, or the repeat reads as corduroy.
  orbShared.uTex.value = tex;
  for (const m of mats) {
    m.uniforms.uPigment.value = tex;
    m.uniforms.uTriScale.value = m.userData.baseTriScale * (key === 'loop' ? 0.34 : 1.0);
  }
  if (key === 'loop') video.play().catch(() => {});
  for (const b of document.querySelectorAll('[data-pigment]'))
    b.setAttribute('aria-pressed', String(b.dataset.pigment === key));
}

function pour(origin, mesh) {
  fillT = 0;
  for (const m of mats) {
    m.uniforms.uFill.value = 0;
    if (origin && mesh && mesh.material === m) m.uniforms.uFillOrigin.value.copy(origin);
    else                                       m.uniforms.uFillOrigin.value.set(0, 0, 0);
  }
}

// ─────────────────────────────────────────────────────────── reaction tally
const TALLY_KEY = 'yunseul-surface-tally-v1';
const loadTally = () => { try { return JSON.parse(localStorage.getItem(TALLY_KEY)) || {}; } catch { return {}; } };
let tally = loadTally();

function vote(score) {
  const row = tally[surface] || (tally[surface] = { 1: 0, 2: 0, 3: 0 });
  row[score]++;
  try { localStorage.setItem(TALLY_KEY, JSON.stringify(tally)); } catch {}
  drawTally();
}

function tallyText() {
  const names = { 1: 'flat', 2: 'ok', 3: 'wow' };
  const rows = Object.keys(SURFACES)
    .filter(k => tally[k])
    .map(k => `${k}: ` + [3, 2, 1].map(s => `${names[s]} ${tally[k][s] || 0}`).join(' / '));
  return rows.length ? rows.join('\n') : 'no votes yet';
}

function drawTally() {
  const row = tally[surface];
  document.getElementById('tally').innerHTML = row
    ? `wow <b>${row[3] || 0}</b> · ok <b>${row[2] || 0}</b> · flat <b>${row[1] || 0}</b>`
    : 'no votes on this surface';
}

// ─────────────────────────────────────────────────────────── XR
const xrBtn = document.getElementById('btn-xr');
let xrMode = null;

if (navigator.xr) {
  (async () => {
    if (await navigator.xr.isSessionSupported('immersive-ar').catch(() => false))      xrMode = 'immersive-ar';
    else if (await navigator.xr.isSessionSupported('immersive-vr').catch(() => false)) xrMode = 'immersive-vr';
    if (xrMode) {
      xrBtn.disabled = false;
      xrBtn.textContent = xrMode === 'immersive-ar' ? 'Enter passthrough' : 'Enter VR';
    } else {
      xrBtn.textContent = 'No headset here';
    }
  })();
} else {
  xrBtn.textContent = 'No WebXR here';
}

xrBtn.addEventListener('click', async () => {
  if (!xrMode) return;
  try {
    const session = await navigator.xr.requestSession(xrMode, {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['hit-test', 'hand-tracking', 'anchors', 'plane-detection']
    });
    await renderer.xr.setSession(session);
  } catch (e) {
    xrBtn.textContent = 'XR refused';
    console.warn(e);
  }
});

// Reticle for AR placement.
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.055, 0.065, 48).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xF0EEE6, transparent: true, opacity: 0.9 })
);
reticle.visible = false;
reticle.matrixAutoUpdate = false;
scene.add(reticle);

let hitSource = null, viewerSpace = null;

renderer.xr.addEventListener('sessionstart', async () => {
  inXR = true;
  const session = renderer.xr.getSession();
  const ar = session.environmentBlendMode !== 'opaque';
  room.visible   = !ar;
  scene.background = ar ? null : new THREE.Color(0x0b0e12);
  scene.fog        = ar ? null : roomFog;
  plates.visible = true;
  controls.enabled = false;
  initAudio();
  needArtHang = true;          // re-hang the wall piece in front of wherever they are
  wallScanned = false;
  if (ar) {
    placed = false;
    deskRoot.visible = false;
    try {
      viewerSpace = await session.requestReferenceSpace('viewer');
      hitSource = await session.requestHitTestSource({ space: viewerSpace });
    } catch (e) { console.warn('hit-test unavailable', e); }
    if (!hitSource) {           // no hit-test: drop it at a plausible desk height ahead
      deskRoot.position.set(0, DESK.h, -0.55);
      deskRoot.visible = true;
      placed = true;
    }
  } else {
    deskRoot.position.set(0, DESK.h, -0.55);
    deskRoot.visible = true;
    placed = true;
  }
  refreshPlates();
});

renderer.xr.addEventListener('sessionend', () => {
  inXR = false;
  if (hitSource) { hitSource.cancel?.(); hitSource = null; }
  reticle.visible = false;
  planeScanned = false; calibrating = false; calibA = calibB = null;
  calibBox.visible = false; placedBy = '';
  setDeskSize(DESK.w, DESK.d);
  room.visible = true;
  scene.background = new THREE.Color(0x0b0e12);
  scene.fog = roomFog;
  plates.visible = false;
  controls.enabled = true;
  deskRoot.visible = true;
  deskRoot.position.set(0, DESK.h, 0);
  deskRoot.quaternion.identity();
});

// Pinch (hand tracking) and trigger both raise 'select'.
const raycaster = new THREE.Raycaster();
const tmpMat = new THREE.Matrix4();

function onSelect(event) {
  if (event.target && event.target.userData.isHand) return;
  if (surface === 'canvas') { pour(); return; }
  if (!placed) {
    if (reticle.visible) {
      deskRoot.position.setFromMatrixPosition(reticle.matrix);
      deskRoot.quaternion.setFromRotationMatrix(reticle.matrix);
      deskRoot.visible = true;
      placed = true;
      placedBy = 'tap';
      reticle.visible = false;
      pour();
    }
    return;
  }
  const ctrl = event.target;
  tmpMat.identity().extractRotation(ctrl.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpMat);

  const onPlate = raycaster.intersectObjects(plateMeshes, false)[0];
  if (onPlate) {
    const key = onPlate.object.userData.key;
    if (key === 'pour') pour();
    else if (key === 'sound') toggleSound();
    else setSurface(key);
    return;
  }
  const onSurf = raycaster.intersectObjects(activeMeshes(), true)[0];
  if (onSurf) pour(onSurf.object.worldToLocal(onSurf.point.clone()), onSurf.object);
  else        pour();
}

for (const i of [0, 1]) {
  const c = renderer.xr.getController(i);
  c.addEventListener('connected',    e => { c.userData.isHand = !!e.data.hand; });
  c.addEventListener('disconnected', () => { c.userData.isHand = false; });
  c.addEventListener('select', onSelect);
  scene.add(c);
}

// ─────────────────────────────────────────────────────────── desktop input
renderer.domElement.addEventListener('pointerdown', e => {
  if (inXR) return;
  const r = renderer.domElement.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2(
    ((e.clientX - r.left) / r.width) * 2 - 1,
    -((e.clientY - r.top) / r.height) * 2 + 1
  ), camera);
  const hit = raycaster.intersectObjects(activeMeshes(), true)[0];
  if (surface === 'orb') {
    if (hit) {
      orbShared.uTouch.value = 1;
      orbMat.uniforms.uTouchPt.value.copy(hit.object.worldToLocal(hit.point.clone()));
    } else cycleOrbMode();
    return;
  }
  if (hit) pour(hit.object.worldToLocal(hit.point.clone()), hit.object);
});

// ─────────────────────────────────────────────────────────── loop
const readout = document.getElementById('readout');
let frames = 0, fpsClock = performance.now(), fps = 0, last = performance.now();
const camPos = new THREE.Vector3();

renderer.setAnimationLoop((time, frame) => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  orbShared.uTime.value += dt;
  audioFrame(surface === 'orb' ? orbShared.uTouch.value : 0, dt);
  if (surface === 'orb') {
    layoutCatchers();
    if (!inXR) orbShared.uTouch.value *= Math.pow(0.08, dt);   // desktop pulse decays
  }

  // Bucket flood: ~0.33 s to cover the surface, then hold.
  if (fillT < 1) {
    fillT = Math.min(1, fillT + dt / 0.33);
    const e = 1 - Math.pow(1 - fillT, 3);
    for (const m of mats) m.uniforms.uFill.value = e * 1.08;
  }

  if (inXR && frame) {
    const ref = renderer.xr.getReferenceSpace();
    if (ref) {
      if (needArtHang) {
        const cam = renderer.xr.getCamera();
        const eye = new THREE.Vector3(); cam.getWorldPosition(eye);
        const yaw = headYaw();
        artRoot.position.set(eye.x - Math.sin(yaw) * 1.3, eye.y, eye.z - Math.cos(yaw) * 1.3);
        artRoot.rotation.set(0, yaw, 0);
        artRoot.visible = surface === 'canvas';
        // within arm's reach, a little below eye line, so a hand can get to it seated
        orbRoot.position.set(eye.x - Math.sin(yaw) * 0.52, eye.y - 0.16, eye.z - Math.cos(yaw) * 0.52);
        placedArt = true; placedBy = 'in front';
        needArtHang = false;
      }
      if (surface === 'canvas') scanWalls(frame, ref);
      else if (surface !== 'orb') scanPlanes(frame, ref);
      if (surface === 'orb') updateTouch(frame, ref);
      trackHands(frame, ref);
    }
  }

  // AR placement reticle.
  if (inXR && !placed && hitSource && frame) {
    const hits = frame.getHitTestResults(hitSource);
    const ref = renderer.xr.getReferenceSpace();
    if (hits.length) {
      const pose = hits[0].getPose(ref);
      reticle.visible = true;
      reticle.matrix.fromArray(pose.transform.matrix);
      reticle.updateMatrixWorld(true);
    } else {
      reticle.visible = false;
    }
  }

  // Billboard the control plates toward the viewer.
  if (plates.visible) {
    layoutUI();
    (inXR ? renderer.xr.getCamera() : camera).getWorldPosition(camPos);
    for (const m of plateMeshes) {
      m.lookAt(camPos);
    }
  }

  if (!inXR) controls.update();
  renderer.render(scene, camera);

  frames++;
  if (now - fpsClock > 500) {
    fps = Math.round((frames * 1000) / (now - fpsClock));
    frames = 0; fpsClock = now;
    readout.innerHTML =
      `<b>${SURFACES[surface].label}</b>${surface === 'orb' ? ' · ' + ORB_MODES[orbMode] : ''} · ${pigment}<br>` +
      `${BUILD === '__BUILD__' ? 'dev' : BUILD} · ${fps} fps · ${inXR ? (calibrating ? (surface === 'canvas' ? 'sizing the piece…' : 'measuring desk…')
        : surface === 'canvas' ? `${ART.w.toFixed(2)}×${ART.h.toFixed(2)} m · ${placedBy || 'in front'}`
        : placed ? `desk ${deskSize.w.toFixed(2)}×${deskSize.d.toFixed(2)} m · ${placedBy}`
        : 'pinch both hands at two desk corners') : 'desktop'}`;
  }
});

setSurface('orb');
setPigment('still');
drawTally();

// Handle for headless checks and for rendering clips off this page.
window.__demo = {
  audio: () => ({ ctx: actx && actx.state, wash: washGain ? +washGain.gain.value.toFixed(4) : null,
                  soundOn, drops: dropCount, lfo: washLfo ? +washLfo.frequency.value.toFixed(2) : null }),
  toggleSound, initAudio,
  setSurface, setPigment, setDeskSize, setCanvasSize, pour, deskSize, ART,
                  setOrbMode, cycleOrbMode, orbRoot, orbMat, orbShared, catchers, ORB_MODES,
                  artRoot, commitArt, applyYaw, applyDepth, headYaw, headRight,
                  THREE, scene, camera, controls, renderer, video };
</script>
</body>
</html>
